<!DOCTYPE html>
<!--
  Offline fixture: Lazada VN product page
  Used by: tpl-sea-lazada-scrape-product
  Selectors exercised:
    span.pdp-mod-product-badge-title          — title
    span.pdp-price.pdp-price_type_normal      — price
    div.score-average                         — rating
  State: in-stock
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iPhone 15 Pro Max 256GB | Lazada.vn</title>
</head>
<body>
  <main class="pdp-container">
    <div class="pdp-mod-product-info">
      <h1>
        <span class="pdp-mod-product-badge-title">iPhone 15 Pro Max 256GB Chính Hãng VN/A - Lazada Mall</span>
      </h1>

      <div class="pdp-product-price">
        <span class="pdp-price pdp-price_type_normal pdp-price_color_orange pdp-price_size_xl">₫29.190.000</span>
        <span class="pdp-price pdp-price_type_deleted">₫32.990.000</span>
      </div>

      <div class="pdp-review-summary">
        <div class="score">
          <div class="score-average">4.8</div>
          <div class="review-count">1,234 đánh giá</div>
        </div>
      </div>

      <div class="pdp-mod-product-stock">
        <span>Còn hàng: 87 sản phẩm</span>
      </div>

      <div class="pdp-block-section">
        <button class="pdp-button pdp-button_theme_orange pdp-button_type_text pdp-mod-product-badge-ref">
          Thêm vào giỏ hàng
        </button>
      </div>
    </div>
  </main>
</body>
</html>
